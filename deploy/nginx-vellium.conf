server {
    listen 127.0.0.1:8310;
    server_name _;
    root /opt/vellium-web/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self)" always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://jabznldqaeqtgtczulwa.supabase.co wss://jabznldqaeqtgtczulwa.supabase.co; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    location /assets/ {
        try_files $uri =404;
        error_page 404 = @missing_asset;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location @missing_asset {
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 404;
    }

    location ~ /\.(?!well-known/) {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 404;
    }

    location = /tgclear/tool {
        proxy_pass http://127.0.0.1:8742/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' wss://ssskkkiiieee.bond; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
    }

    location ^~ /tgclear/static/ {
        proxy_pass http://127.0.0.1:8742/static/;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /tgclear/api/ {
        proxy_pass http://127.0.0.1:8742/api/;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /tgclear/ws/ {
        proxy_pass http://127.0.0.1:8742/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, no-cache, no-transform" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(self)" always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://jabznldqaeqtgtczulwa.supabase.co wss://jabznldqaeqtgtczulwa.supabase.co; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
